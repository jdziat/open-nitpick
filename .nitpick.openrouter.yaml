# open-nitpick's own review configuration, on OpenRouter instead of
# Synthetic: the same policy as .nitpick.yaml with the same weights reached
# through a different host, for anyone who has an OpenRouter key and not a
# Synthetic one. Use it with -config:
#
#   nitpick review -config .nitpick.openrouter.yaml
#
# or copy it over .nitpick.yaml. Review policy stays aligned with the shipped
# defaults; model routing and scan performance may differ by endpoint.
#
# Model assignments follow /home/jdziat/Code/jdziat/mega-smart-router/docs/model-breakdown.md
# (benchmarked 2026-09-16):
#   - gpt-5.6-luna scores 10.00 at $0.00045/call with flex, the benchmark's
#     best quality-per-dollar. Flex halves the standard $0.00090 rate.
#   - glm-5.3-flash scores 9.93 at $0.00057/call, the cheapest serious model,
#     but has no flex tier and collapses on architecture tasks (4/10 rate
#     limiter, 0/10 distributed scheduler).
#   - qwen/qwen3.8-27b is not in the benchmark's viable tiers; it is replaced.
#     The reasoning-light optimum is glm-5.3-flash (same as reasoning tier).

models:
  # The built-in endpoint uses OPENROUTER_API_KEY; credentials stay local.
  default:
    provider: openrouter
    model: openai/gpt-5.6-luna
    # Flex trades latency and availability for price. A review is advisory
    # and offline, so a slow or deferred endpoint costs nothing but time.
    # Flex never falls back to standard, so a capacity failure is reported
    # rather than silently billed at the higher rate.
    service_tier: flex

  triage:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    temperature: 0
    # Triage merges and filters findings. It is deterministic work on a list
    # of already-extracted findings, not architecture, and glm-5.3-flash is
    # the benchmark's cheapest serious model for it. No flex tier exists for
    # this model, so it prices at standard.
    #
    # service_tier is deliberately unset: sending flex to a model without
    # flex endpoints routes normally, and it is clearer to omit the field
    # than to send it and have it be a no-op.

  fix:
    provider: openrouter
    model: z-ai/glm-5.3-flash
    # Use the same GLM model for deterministic edits. Temperature stays 0:
    # a suggested patch that varies between runs is not a suggested patch.
    # No flex tier exists for this model.
    providers: [z-ai]
    temperature: 0

review:
  # Advisory: this project reviews itself, and a false positive should not
  # block its own PRs.
  fail_on: none
  min_severity: info
  concurrency: 2
  # Keep each request bounded so repository-wide scans finish predictably;
  # related context is still attached across batches.
  token_budget_per_request: 24000
  # Definitions the change imports are attached by default. The caller
  # walk, which reads files the change never named, is off by default and
  # on here, where reviews are advisory and the repository is this one;
  # docs/findings.md's callers section is the evidence for what it finds.
  related_context: true
  related_context_callers: true

instructions:
  - path: "**/*.go"
    prompt: >-
      Flag unchecked errors, ignored context cancellation, and goroutines that
      can outlive their caller. Do not comment on formatting or naming.

  - path: "internal/diff/**"
    prompt: >-
      This package maps diff lines to review-comment anchors. An off-by-one
      here misplaces every comment in a file, so treat any change to position
      or line-number arithmetic as high risk and reason about it explicitly.

  - path: "internal/llm/**"
    prompt: >-
      This package must keep working across providers with very different
      capabilities. Flag anything that assumes a provider supports tools,
      JSON-schema response formats, or a particular error shape.

  - path: "**/*_test.go"
    prompt: >-
      Judge whether the test would actually fail if the behavior it describes
      broke. Do not ask for more tests for their own sake.

linters:
  mode: auto
  enabled: [golangci-lint]
  only_changed_lines: true
