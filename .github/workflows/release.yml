name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # A tag that does not build or pass its tests must not become a release.
      - name: Verify
        run: |
          go vet ./...
          go test -race ./...

      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="nitpick_${version}_${os}_${arch}"

            ext=""
            [ "$os" = "windows" ] && ext=".exe"

            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}${ext}" ./cmd/nitpick
          done

          cd dist && sha256sum * > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
