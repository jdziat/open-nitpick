name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: the workflow's OIDC identity is the signer, and a
      # verifier checks the certificate against this repository and
      # workflow rather than a key anyone could have copied.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      # A tag that does not build or pass its tests must not become a release.
      - name: Verify
        run: |
          go vet ./...
          go test -race ./...

      - name: Build binaries
        run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Checksums
        run: |
          cd dist
          [ -f checksums.txt ] || sha256sum -- * > checksums.txt

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1

      # One Sigstore bundle per asset, checksums included, so a verifier
      # needs the asset, its bundle, and the identity below, nothing else:
      #   cosign verify-blob --bundle FILE.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/jdziat/open-nitpick/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE
      - name: Sign
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag that is moved and pushed again rebuilds the release it already
        # has rather than failing on the name: the assets are replaced, the
        # notes are kept.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi

      # The Action is used as @vN; the major tag follows every vN.x.y
      # release so that pin gets the fixes without a rewrite.
      - name: Move the major tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          [ "$major" = "$GITHUB_REF_NAME" ] && exit 0
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "$major"
