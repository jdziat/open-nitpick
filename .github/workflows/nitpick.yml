# open-nitpick reviewing its own pull requests.
name: Review

on:
  # synchronize is safe: a run on a pull request this tool has reviewed before
  # reads only the files changed since, and withholds findings already posted
  # (review.incremental, on by default).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A new push supersedes an in-flight review; reviewing a stale commit wastes
  # tokens and posts comments on code that has already changed.
  group: nitpick-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Reviews of forked pull requests would need a token this workflow does not
    # safely have, and the model API key must never be exposed to fork code.
    #
    # Dependabot is excluded for a different reason: GitHub withholds the
    # repository's secrets from a pull_request run whose actor is
    # dependabot[bot], keeping them in a separate Dependabot store, so the
    # reviewer starts with no model credential and exits 2 with "API key is
    # required". That is a red check on every dependency bump, saying nothing
    # about the bump. Skipping is the honest answer rather than making a
    # missing key exit 0, which would hide a real misconfiguration everywhere
    # else. A SHA bump with the tag in the comment beside it is verified by
    # reading the two, not by a model.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    env:
      # A step's if cannot read the secrets context; it can read env.
      NITPICK_APP_ID: ${{ secrets.NITPICK_APP_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reviewer diffs against the base branch, so it needs history.
          fetch-depth: 0

      # Reviews post under the GitHub App's own name and avatar, with its
      # own permissions, when the App is configured: NITPICK_APP_ID and
      # NITPICK_APP_PRIVATE_KEY as repository secrets (GitHub
      # refuses secret names that start with GITHUB_). Without them the
      # default job token posts as github-actions[bot].
      - name: Token for the review app
        id: app
        if: env.NITPICK_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.NITPICK_APP_ID }}
          private-key: ${{ secrets.NITPICK_APP_PRIVATE_KEY }}

      # Without these the review's deterministic half is absent: the reviewer
      # reports "golangci-lint is not on PATH" and posts model findings alone,
      # on every pull request, which reads the same as an analyzer that ran and
      # found nothing. The toolchain comes from go.mod and the analyzer from
      # tools/go.mod, the pair ci.yml uses, because a golangci-lint built with
      # an older Go refuses a go.mod that targets a newer one.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        working-directory: tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      # Build this checkout so the review exercises the policy implementation in CI.
      - name: Review with the current source
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          NITPICK_BOT_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
        run: go run ./cmd/nitpick review -skip-draft -fail-on none
