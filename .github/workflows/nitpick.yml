# open-nitpick reviewing its own pull requests.
name: Review

on:
  # Deliberately NOT synchronize: reviews are not yet deduplicated against
  # comments already on the pull request, so every push would re-post the same
  # findings. Add synchronize once incremental re-review lands.
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A new push supersedes an in-flight review; reviewing a stale commit wastes
  # tokens and posts comments on code that has already changed.
  group: nitpick-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Reviews of forked pull requests would need a token this workflow does not
    # safely have, and the model API key must never be exposed to fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # The reviewer diffs against the base branch, so it needs history.
          fetch-depth: 0

      - uses: ./
        with:
          # Must agree with .nitpick.yaml. The config file wins on provider and
          # model — these inputs only reach LLM_PROVIDER/LLM_MODEL, which are a
          # fallback for what the file does not say — but api-key is passed as
          # LLM_API_KEY regardless, so naming a different vendor's secret here
          # would hand that credential to whatever endpoint the file selected.
          provider: openrouter
          model: anthropic/claude-sonnet-4.6
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Advisory until the reviewer has earned the right to block merges.
          fail-on: none
