name: Notary image

# Publishes the notary container image and its helm chart to ghcr.io when a
# release tag is pushed, beside the binaries the Release workflow builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (a manual run pushes this tag)"
        required: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to ghcr.io/<owner>/ with the workflow's own token.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT:-${REF_NAME#v}}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version: $v" >&2; exit 1 ;;
          esac
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase because a registry path must be, and an owner may not be.
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/nitpick-notary" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          provenance: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:latest

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      # The chart's version and appVersion are both the release, so the default
      # image tag is the image this run just pushed.
      - name: Package and push the chart
        env:
          VERSION: ${{ steps.version.outputs.value }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          helm lint deploy/helm/nitpick-notary --set 'tokens[0].name=ci' --set 'tokens[0].role=read' --set "tokens[0].hash=$(printf 'a%.0s' $(seq 64))"
          helm package deploy/helm/nitpick-notary --version "$VERSION" --app-version "$VERSION" --destination dist-chart
          printf %s "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist-chart/nitpick-notary-$VERSION.tgz" "oci://ghcr.io/${OWNER,,}/charts"
