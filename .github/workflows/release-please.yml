name: Release PR

# Semantic releases from conventional commits: on every push to main,
# release-please keeps one pull request open whose title carries the next
# version, computed from the commit types since the last tag (feat: minor,
# fix: patch, a "!" or BREAKING CHANGE footer: major), and whose body is the
# changelog. Merging that pull request tags the release and creates it on
# GitHub; release.yml then builds, signs and attaches the binaries.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal token rather than the workflow's own: a pull request
          # the default token opens gets no workflow runs, so every release
          # PR would wait on a manual approval. The token is fine-grained to
          # this repository with contents and pull requests read and write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
