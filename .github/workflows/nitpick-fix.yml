# open-nitpick applying a finding on @open-nitpick fix.
#
# A separate file from nitpick-respond.yml rather than another job in it, and
# the separation is the point: this is the only workflow here that carries
# contents: write. One typo in the condition below costs write access to the
# repository, where the same typo in the respond workflow costs a wasted
# answer, so the two do not share a condition to get wrong.
name: Fix

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Per pull request. Two fix asks in a minute derive the same branch name, and
  # the second would otherwise race the first to create it.
  group: nitpick-fix-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  fix:
    runs-on: ubuntu-latest
    # Four conditions. The comment asks for a fix, the event is on a pull
    # request, the author is one the forge calls a writer, and the pull request
    # is not from a fork.
    #
    # The fork test is the one this workflow adds over the respond workflow.
    # A fix reads the head's code and writes a branch here, so a fork's pull
    # request would put code from outside this repository on a branch inside
    # it, under this tool's name. `nitpick respond` refuses the same thing
    # itself, and vcs.ProposeChange refuses it again at the write; this is the
    # cheap half that stops the runner from starting.
    #
    # The association test is not the write gate. GitHub's COLLABORATOR covers
    # anyone invited to the repository, read access included, so the binary
    # asks the forge for the asker's actual permission before it writes.
    if: >-
      contains(github.event.comment.body, '@open-nitpick fix') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      )
    env:
      NITPICK_APP_ID: ${{ secrets.NITPICK_APP_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The App token, and no fallback to github.token.
      #
      # A pull request opened with the default token raises no workflow, so the
      # fix would arrive with no checks at all while its body says the checks
      # are the verification. That is a promise nothing keeps, and refusing to
      # run is better than making it.
      - name: Token for the review app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.NITPICK_APP_ID }}
          private-key: ${{ secrets.NITPICK_APP_PRIVATE_KEY }}

      - uses: ./
        with:
          command: respond
          github-token: ${{ steps.app.outputs.token }}
          provider: synthetic
          model: hf:moonshotai/Kimi-K3
          api-key: ${{ secrets.SYNTHETIC_API_KEY }}
