# open-nitpick answering @nitpick comments on its own pull requests.
name: Respond

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: nitpick-respond-${{ github.event.comment.id }}

jobs:
  respond:
    runs-on: ubuntu-latest
    # Only a comment on a pull request that addresses the reviewer; the
    # command re-checks both, this just saves the runner.
    if: >-
      contains(github.event.comment.body, '@nitpick') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null)
    env:
      NITPICK_APP_ID: ${{ secrets.NITPICK_APP_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Token for the review app
        id: app
        if: env.NITPICK_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.NITPICK_APP_ID }}
          private-key: ${{ secrets.NITPICK_APP_PRIVATE_KEY }}

      - uses: ./
        with:
          command: respond
          github-token: ${{ steps.app.outputs.token || github.token }}
          provider: synthetic
          model: hf:moonshotai/Kimi-K3
          api-key: ${{ secrets.SYNTHETIC_API_KEY }}
