# open-nitpick answering @open-nitpick comments on its own pull requests.
name: Respond

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Per pull request, not per comment. Keyed on the comment id, twenty comments
  # in a minute were twenty concurrent runs. Keyed here, one runs, one waits,
  # and the rest are cancelled while pending: a burst costs two runs instead of
  # twenty. The trade is real and worth naming, because it is a dropped answer
  # rather than a delayed one: two questions asked seconds apart may leave one
  # unanswered, and the person has to ask again.
  group: nitpick-respond-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  respond:
    runs-on: ubuntu-latest
    # Three conditions, and the third is the one that matters for money.
    #
    # A comment event runs HERE, in the base repository, with this
    # repository's secrets, whoever wrote the comment. Without the
    # author_association test, every account on GitHub can spend the model
    # credit one "@open-nitpick" at a time, and each attempt also burns a runner.
    # `nitpick respond` refuses the same set by itself (review.respond.from),
    # so this is the cheap half of the same gate: it stops the runner from
    # starting rather than stopping it after checkout.
    #
    # A fix is answered by nitpick-fix.yml, which carries contents: write and
    # a fork test this workflow does not need. Excluded here so one ask does
    # not start two runs that both try to create the same branch.
    if: >-
      contains(github.event.comment.body, '@open-nitpick') &&
      !contains(github.event.comment.body, '@open-nitpick fix') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      )
    env:
      NITPICK_APP_ID: ${{ secrets.NITPICK_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Token for the review app
        id: app
        if: env.NITPICK_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.NITPICK_APP_ID }}
          private-key: ${{ secrets.NITPICK_APP_PRIVATE_KEY }}

      - uses: ./
        with:
          command: respond
          bot-login: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          provider: synthetic
          model: hf:zai-org/GLM-5.3-Flash
          api-key: ${{ secrets.SYNTHETIC_API_KEY }}
