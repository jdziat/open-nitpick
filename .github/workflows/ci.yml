name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The suite runs once on each engine the server supports, against real servers.
  # NITPICK_REQUIRE_DATABASES turns a database test that cannot find its server into
  # a failure: skipped, it would be a test that did not run, reported as a pass.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql]
    name: test (${{ matrix.engine }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dev
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NITPICK_REQUIRE_DATABASES: '1'
      NITPICK_TEST_ENGINE: ${{ matrix.engine }}
      NITPICK_TEST_POSTGRES_URL: postgres://postgres:dev@127.0.0.1:5432/postgres?sslmode=disable
      NITPICK_TEST_MYSQL_URL: mysql://root:dev@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain go.mod declares, not the newest one. golangci-lint is
      # pinned in tools/go.mod and its type checker refuses export data from a
      # Go newer than the one it was built against: `stable` reaching go1.27.1
      # failed every analyzer test with "export data version 4 is greater than
      # maximum supported version 2". Pinning the analyzer without pinning the
      # toolchain moves the floating part rather than removing it. The build
      # job below stays on `stable`, so a Go release that breaks this module
      # is still caught, just not by the job that measures analyzer output.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The eval battery is behind a build tag, so `go vet ./...` never
      # compiles it and a signature change in a package it uses lands green.
      # #85 changed knowledge.Retriever.Retrieve and left
      # internal/evals/knowledge_live_test.go uncompilable; CI said nothing.
      - name: Vet the eval battery
        run: go vet -tags=eval ./...

      # internal/linters drives the real analyzer and skips when the binary is
      # absent, so without this the tests that measure golangci-lint's own
      # behaviour never ran here and a green CI meant silence rather than a
      # pass. The version comes from tools/go.mod, which is where Dependabot
      # can see it.
      - name: Install golangci-lint
        working-directory: tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      # The race detector matters here: the engine reviews batches concurrently
      # and mutates a shared client's structured-output mode.
      - name: Test
        run: go test -race -p 1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build ./...

  # The chart is rendered for every database it can run on, so a template that
  # fails for one engine, or lets the two settings contradict each other, fails
  # here and not on a release.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # yamllint disable-line rule:line-length
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
      - name: Lint and render each database
        run: |
          chart=deploy/helm/nitpick-server
          for bundled in postgres mysql; do
            for replicas in 1 3; do
              helm lint "$chart" --set "database.bundled=$bundled" --set "replicaCount=$replicas"
              helm template r "$chart" --set "database.bundled=$bundled" --set "replicaCount=$replicas" > "$RUNNER_TEMP/$bundled-$replicas.yaml"
              grep -q "replicas: $replicas" "$RUNNER_TEMP/$bundled-$replicas.yaml"
              grep -q "kind: StatefulSet" "$RUNNER_TEMP/$bundled-$replicas.yaml"
            done
          done
          ext=(--set database.bundled=none --set externalDatabase.url=postgres://u:p@db.example:5432/nitpick)
          helm lint "$chart" "${ext[@]}"
          helm template r "$chart" "${ext[@]}" > "$RUNNER_TEMP/none.yaml"
          if grep -q "kind: StatefulSet" "$RUNNER_TEMP/none.yaml"; then
            echo "database.bundled=none still renders a database" >&2
            exit 1
          fi
      # Each refusal must be a refusal: a chart that renders for a setting that
      # cannot work is worse than one that fails.
      - name: Refuse settings that cannot work
        run: |
          chart=deploy/helm/nitpick-server
          for bad in \
            "database.bundled=none" \
            "database.bundled=oracle" \
            "externalDatabase.url=postgres://x" \
            "replicaCount=11"; do
            if helm template r "$chart" --set "$bad" > /dev/null 2>&1; then
              echo "helm rendered with $bad, which must be refused" >&2
              exit 1
            fi
          done

  # The hub UI under ui/. The Go tests skip the embedded-build path when ui/dist
  # does not exist, so this job builds it and runs that path: without it, a
  # change that breaks the build output the server serves would pass every
  # other job.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # --ignore-scripts: no package's install script runs on the runner.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ui
      # What ships to the browser. .npmrc turns the audit off for a plain install,
      # which would otherwise add a network call to every build.
      - name: Audit what the browser runs
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui
      - name: Type check
        run: npx tsc -b
        working-directory: ui
      - name: Test
        run: npx vitest run
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui
      - name: Embed the build and serve it
        run: |
          go run ./internal/server/uibuild
          go test -race -run 'TestTheBuiltUI' ./internal/server/ -v | tee "$RUNNER_TEMP/ui-test.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/ui-test.log"; then
            echo "a UI test skipped although the build exists" >&2
            exit 1
          fi

  # Binaries for every push and pull request, built by the same target the
  # release uses, so a change can be tried on a runner before it is tagged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Build binaries
        run: make dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nitpick-binaries
          path: dist/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # go.mod's toolchain, for the reason the test job pins it: golangci-lint
      # 2.8.0 cannot read a newer Go's export data.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Built with the repository's own toolchain: a prebuilt golangci-lint
      # compiled with an older Go refuses a go.mod that targets a newer one.
      # The version is tools/go.mod's, the same one the analyzer tests measure
      # against, so both jobs move together and neither moves on its own.
      - name: Install golangci-lint
        working-directory: tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: Lint
        run: golangci-lint run
      # shellcheck is on the runner image. The install script is piped into sh
      # by users, so a quoting mistake in it is a bug in every one of their
      # shells.
      - name: Shellcheck the install script
        run: shellcheck -s sh website/install.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install ESLint
        run: |
          npm install --prefix "$RUNNER_TEMP/nitpick-node" --no-audit --no-fund eslint@10.8.0
          echo "$RUNNER_TEMP/nitpick-node/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install Python analyzer
        run: |
          python3 -m venv "$RUNNER_TEMP/nitpick-python"
          "$RUNNER_TEMP/nitpick-python/bin/pip" install 'ruff==0.16.1'
          echo "$RUNNER_TEMP/nitpick-python/bin" >> "$GITHUB_PATH"
      - name: Enforce repository standards
        run: go run ./cmd/nitpick repo-standards -check
      - name: Report engineering coverage
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: go run ./cmd/nitpick repo-standards -profile engineering -no-model -base "$POLICY_BASE"

  language-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install language linters
        run: ./scripts/install-language-linters.sh "$RUNNER_TEMP/nitpick-language-tools"
      - name: Verify conventions with real linters
        env:
          NITPICK_REQUIRE_LANGUAGE_LINTERS: '1'
        run: go test ./internal/linters -run '^TestLanguageConvention' -count=1 -v

  # The documentation site builds in strict mode, so a broken link in the
  # README or docs/ fails the pull request rather than the deploy.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: pip install mkdocs-material==9.7.6
      - run: make docs
      # The configuration reference is generated, so a key added without a
      # sentence about it fails the build that added it rather than sitting
      # undocumented until someone notices.
      - name: The generated reference is current
        run: git diff --exit-code -- docs/configuration-reference.md
      - run: make agents
      # The measured conventions are generated from the tree, so a change that
      # moves one updates the file that tells agents about it, in the same
      # pull request. A rule nobody can retire is a rule nobody can trust.
      - name: The measured conventions are current
        run: git diff --exit-code -- AGENTS.md
