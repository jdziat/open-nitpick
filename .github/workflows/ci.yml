name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain go.mod declares, not the newest one. golangci-lint is
      # pinned in tools/go.mod and its type checker refuses export data from a
      # Go newer than the one it was built against: `stable` reaching go1.27.1
      # failed every analyzer test with "export data version 4 is greater than
      # maximum supported version 2". Pinning the analyzer without pinning the
      # toolchain moves the floating part rather than removing it. The build
      # job below stays on `stable`, so a Go release that breaks this module
      # is still caught, just not by the job that measures analyzer output.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The eval battery is behind a build tag, so `go vet ./...` never
      # compiles it and a signature change in a package it uses lands green.
      # #85 changed knowledge.Retriever.Retrieve and left
      # internal/evals/knowledge_live_test.go uncompilable; CI said nothing.
      - name: Vet the eval battery
        run: go vet -tags=eval ./...

      # internal/linters drives the real analyzer and skips when the binary is
      # absent, so without this the tests that measure golangci-lint's own
      # behaviour never ran here and a green CI meant silence rather than a
      # pass. The version comes from tools/go.mod, which is where Dependabot
      # can see it.
      - name: Install golangci-lint
        working-directory: tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      # The race detector matters here: the engine reviews batches concurrently
      # and mutates a shared client's structured-output mode.
      - name: Test
        run: go test -race -p 1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build ./...

  # Binaries for every push and pull request, built by the same target the
  # release uses, so a change can be tried on a runner before it is tagged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: Build binaries
        run: make dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nitpick-binaries
          path: dist/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # go.mod's toolchain, for the reason the test job pins it: golangci-lint
      # 2.8.0 cannot read a newer Go's export data.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Built with the repository's own toolchain: a prebuilt golangci-lint
      # compiled with an older Go refuses a go.mod that targets a newer one.
      # The version is tools/go.mod's, the same one the analyzer tests measure
      # against, so both jobs move together and neither moves on its own.
      - name: Install golangci-lint
        working-directory: tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: Lint
        run: golangci-lint run
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install ESLint
        run: |
          npm install --prefix "$RUNNER_TEMP/nitpick-node" --no-audit --no-fund eslint@10.8.0
          echo "$RUNNER_TEMP/nitpick-node/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Enforce repository standards
        run: go run ./cmd/nitpick repo-standards -check
      - name: Report engineering coverage
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: go run ./cmd/nitpick repo-standards -profile engineering -no-model -base "$POLICY_BASE"

  language-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install language linters
        run: ./scripts/install-language-linters.sh "$RUNNER_TEMP/nitpick-language-tools"
      - name: Verify conventions with real linters
        env:
          NITPICK_REQUIRE_LANGUAGE_LINTERS: '1'
        run: go test ./internal/linters -run '^TestLanguageConvention' -count=1 -v

  # The documentation site builds in strict mode, so a broken link in the
  # README or docs/ fails the pull request rather than the deploy.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: pip install mkdocs-material==9.7.6
      - run: make docs
      # The configuration reference is generated, so a key added without a
      # sentence about it fails the build that added it rather than sitting
      # undocumented until someone notices.
      - name: The generated reference is current
        run: git diff --exit-code -- docs/configuration-reference.md
      - run: make agents
      # The measured conventions are generated from the tree, so a change that
      # moves one updates the file that tells agents about it, in the same
      # pull request. A rule nobody can retire is a rule nobody can trust.
      - name: The measured conventions are current
        run: git diff --exit-code -- AGENTS.md

  # Pull request commits follow Conventional Commits, which is what
  # release-please reads to version and describe the next release.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: scripts/check-commits.sh "origin/${{ github.base_ref }}..HEAD"
