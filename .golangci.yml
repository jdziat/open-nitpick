version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert

  settings:
    revive:
      rules:
        - name: exported
          # Every exported symbol in this project is part of the library
          # surface a webhook server or alternative driver will use.
          severity: warning

  exclusions:
    rules:
      # Test helpers legitimately ignore errors from setup calls that would
      # have already failed the test another way.
      - path: _test\.go
        linters:
          - errcheck
      - path: (cmd/nitpick/knowledge_wiring_test\.go|internal/config/docgen/docgen\.go)
        text: "go/parser.ParseDir has been deprecated"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
