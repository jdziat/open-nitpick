name: open-nitpick
description: Self-hosted, model-agnostic pull request review.
author: open-nitpick contributors

branding:
  icon: check-square
  color: purple

inputs:
  github-token:
    description: >-
      Token used to read the pull request and publish the review. The default
      GITHUB_TOKEN is enough; it needs pull-requests: write. On a pull request
      from a fork that token is read-only, and the review then goes to the job
      summary and the log instead of the pull request.
    required: false
    default: ${{ github.token }}

  config:
    description: Path to the configuration file, relative to the workspace.
    required: false
    default: .nitpick.yaml

  provider:
    description: >-
      Model provider, overriding models.default.provider. Run
      "nitpick providers" for the full list.
    required: false

  model:
    description: Model name, overriding models.default.model.
    required: false

  api-key:
    description: >-
      API key for the provider. Pass a secret; never a literal. Ignored when
      the provider reads its own conventional environment variable.
    required: false

  fail-on:
    description: >-
      Lowest severity that fails the job: nit, info, warning, error, critical,
      or none. Overrides review.fail_on.
    required: false

  instruction:
    description: An extra instruction applied to this run only.
    required: false

  pr-number:
    description: >-
      Pull request to review. Defaults to the triggering pull request; set it
      on workflow_dispatch or issue_comment runs.
    required: false

  dry-run:
    description: >-
      Print the review to the log and the job summary instead of publishing
      it. The way to try the reviewer on a repository before it posts anything.
    required: false
    default: "false"

  skip-drafts:
    description: Do nothing on a draft pull request.
    required: false
    default: "false"

  version:
    description: >-
      Version of open-nitpick to install: a release tag such as v1.0.0, or
      latest. The release binary for the runner is downloaded and its checksum
      verified; when no release matches — or the repository is private and
      its releases cannot be fetched — the binary is built from the Action's
      own checkout, which is the ref the workflow named.
    required: false
    default: latest

  analyzers:
    description: >-
      Deterministic analyzers to install on the runner before the review, as
      a comma-separated list of catalog names (run "nitpick linters" for
      them), or "auto" to install the ones for the languages the change
      touches. Empty installs nothing: the review then runs whatever the
      runner already has. Installed tools are cached by version.
    required: false
    default: ""

  args:
    description: Additional flags passed verbatim to "nitpick review".
    required: false

outputs:
  result:
    description: >-
      One of "clean" (no findings at or above fail-on), "findings" (the gate
      was tripped), "skipped" (a draft, with skip-drafts), or "error" (the
      review could not run). Distinguishing the last is the point: a broken
      reviewer must not read as a passing one.
    value: ${{ steps.review.outputs.result }}

  findings:
    description: Number of findings published.
    value: ${{ steps.review.outputs.findings }}

  critical:
    description: Findings at critical.
    value: ${{ steps.review.outputs.critical }}

  error:
    description: Findings at error.
    value: ${{ steps.review.outputs.error }}

  warning:
    description: Findings at warning.
    value: ${{ steps.review.outputs.warning }}

  files:
    description: Files reviewed.
    value: ${{ steps.review.outputs.files }}

  withheld:
    description: Findings withheld because an earlier review already posted them.
    value: ${{ steps.review.outputs.withheld }}

runs:
  using: composite
  steps:
    - name: Install open-nitpick
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: jdziat/open-nitpick
        API: ${{ github.api_url }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/nitpick-bin"
        mkdir -p "$bin"

        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"
        case "$arch" in
          x86_64)  arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
        esac

        version="$VERSION"
        if [ "$version" = "latest" ]; then
          # Releases live on github.com even when the workflow runs on GHES.
          version="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/latest" 2>/dev/null \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1 || true)"
        fi

        if [ -n "$version" ]; then
          asset="nitpick_${version}_${os}_${arch}"
          base="https://github.com/$REPO/releases/download/$version"
          if curl -fsSL -o "$bin/nitpick" "$base/$asset" && curl -fsSL -o "$bin/checksums.txt" "$base/checksums.txt"; then
            expected="$(grep " $asset\$" "$bin/checksums.txt" | awk '{print $1}')"
            actual="$(sha256sum "$bin/nitpick" | awk '{print $1}')"
            if [ -n "$expected" ] && [ "$expected" = "$actual" ]; then
              chmod +x "$bin/nitpick"
              echo "$bin" >> "$GITHUB_PATH"
              echo "source=release $version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::open-nitpick: checksum mismatch for $asset; building from source instead"
          fi
        fi
        echo "source=build" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: steps.install.outputs.source == 'build'
      uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false

    # The Action's own files are on the runner at the ref the workflow named,
    # so the binary can be built from them without fetching the module — which
    # is what makes the Action usable from a private copy of this repository.
    - name: Build open-nitpick from the Action's checkout
      if: steps.install.outputs.source == 'build'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/nitpick-bin"
        mkdir -p "$bin"
        version="$(git -C "$ACTION_PATH" describe --tags --always 2>/dev/null || echo source)"
        (cd "$ACTION_PATH" && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$bin/nitpick" ./cmd/nitpick)
        echo "$bin" >> "$GITHUB_PATH"
        echo "built open-nitpick $version from $ACTION_PATH"

    # The hosted reviewers bring their analyzers; this one runs whatever is
    # on the runner, which on a stock image is nothing. `analyzers` closes
    # that. Each tool is skipped when already present, installed from its
    # own release or package index at a pinned version, and put on PATH.
    - name: Decide which analyzers to install
      id: analyzers
      if: inputs.analyzers != ''
      shell: bash
      env:
        WANT: ${{ inputs.analyzers }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        want="$WANT"
        if [ "$want" = "auto" ]; then
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            changed="$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || git -C "$GITHUB_WORKSPACE" diff --name-only HEAD~1 2>/dev/null || true)"
          else
            changed="$(git -C "$GITHUB_WORKSPACE" diff --name-only HEAD~1 2>/dev/null || true)"
          fi
          want=""
          add() { case ",$want," in *",$1,"*) ;; *) want="${want:+$want,}$1" ;; esac; }
          while IFS= read -r f; do
            case "$f" in
              *.go) add golangci-lint ;;
              *.py|*.pyi) add ruff; add pylint ;;
              *.sh|*.bash) add shellcheck ;;
              Dockerfile|*/Dockerfile|Dockerfile.*|*.dockerfile) add hadolint ;;
              *.yml|*.yaml) add yamllint ;;
              .github/workflows/*) add actionlint; add zizmor ;;
              *.tf|*.tfvars) add tflint; add checkov ;;
              *.sql) add sqlfluff ;;
              *.rb|Gemfile|Rakefile) add rubocop; add brakeman ;;
              *.c|*.cc|*.cpp|*.h|*.hpp) add cppcheck ;;
              *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs) add biome ;;
              *.proto) add buf ;;
              *.lua) add luacheck ;;
              Makefile|*.mk) add checkmake ;;
              .env*) add dotenv-linter ;;
            esac
          done <<< "$changed"
          add gitleaks
        fi
        echo "want=$want" >> "$GITHUB_OUTPUT"
        # A cache key may not contain commas.
        echo "key=$(printf '%s' "$want" | tr ',' '-')" >> "$GITHUB_OUTPUT"
        echo "installing analyzers: ${want:-none}"

    - name: Set up Go for analyzers
      if: inputs.analyzers != '' && contains(steps.analyzers.outputs.want, 'golangci-lint')
      uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false

    - name: Cache analyzer binaries
      if: inputs.analyzers != ''
      uses: actions/cache@v4
      with:
        path: ~/.nitpick-analyzers
        key: nitpick-analyzers-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.analyzers.outputs.key }}

    - name: Install analyzers
      if: inputs.analyzers != ''
      shell: bash
      env:
        WANT: ${{ steps.analyzers.outputs.want }}
      run: |
        set -euo pipefail
        bin="$HOME/.nitpick-analyzers/bin"
        mkdir -p "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        export PATH="$bin:$PATH"
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"; case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
        have() { command -v "$1" >/dev/null 2>&1; }
        fetch() { curl -fsSL --retry 3 "$1"; }
        pip_tool() { have "$1" || pipx install "$2" >/dev/null || python3 -m pip install --user -q "$2"; }
        gem_tool() { have "$1" || gem install --no-document -q "$2" >/dev/null; }
        npm_tool() { have "$1" || npm install -g --silent "$2" >/dev/null; }
        IFS=',' read -r -a tools <<< "$WANT"
        for tool in "${tools[@]}"; do
          case "$tool" in
            golangci-lint) have golangci-lint || GOBIN="$bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest ;;
            ruff)          pip_tool ruff ruff ;;
            pylint)        pip_tool pylint pylint ;;
            yamllint)      pip_tool yamllint yamllint ;;
            sqlfluff)      pip_tool sqlfluff sqlfluff ;;
            checkov)       pip_tool checkov checkov ;;
            zizmor)        pip_tool zizmor zizmor ;;
            shellcheck)    have shellcheck || sudo apt-get install -y -q shellcheck >/dev/null ;;
            cppcheck)      have cppcheck   || sudo apt-get install -y -q cppcheck >/dev/null ;;
            luacheck)      have luacheck   || sudo apt-get install -y -q lua-check >/dev/null ;;
            hadolint)      have hadolint || { fetch "https://github.com/hadolint/hadolint/releases/latest/download/hadolint-$(uname -s)-$(uname -m)" > "$bin/hadolint" && chmod +x "$bin/hadolint"; } ;;
            actionlint)    have actionlint || { bash <(fetch https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$bin" >/dev/null; } ;;
            gitleaks)      have gitleaks || { v="$(fetch https://api.github.com/repos/gitleaks/gitleaks/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')"; fetch "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_${os}_$( [ "$arch" = amd64 ] && echo x64 || echo "$arch" ).tar.gz" | tar -xz -C "$bin" gitleaks; } ;;
            tflint)        have tflint || { TFLINT_INSTALL_PATH="$bin" bash <(fetch https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh) >/dev/null; } ;;
            buf)           have buf || { fetch "https://github.com/bufbuild/buf/releases/latest/download/buf-$(uname -s)-$(uname -m)" > "$bin/buf" && chmod +x "$bin/buf"; } ;;
            checkmake)     have checkmake || GOBIN="$bin" go install github.com/checkmake/checkmake/cmd/checkmake@latest ;;
            dotenv-linter) have dotenv-linter || { fetch https://dotenv-linter.github.io/install.sh | sh -s -- -b "$bin" >/dev/null; } ;;
            rubocop)       gem_tool rubocop rubocop ;;
            brakeman)      gem_tool brakeman brakeman ;;
            biome)         npm_tool biome @biomejs/biome ;;
            oxlint)        npm_tool oxlint oxlint ;;
            htmlhint)      npm_tool htmlhint htmlhint ;;
            markdownlint)  npm_tool markdownlint markdownlint-cli ;;
            "")            ;;
            *) echo "::warning::open-nitpick: no installer for analyzer '$tool'; install it on the runner yourself" ;;
          esac
        done
        for tool in "${tools[@]}"; do
          [ -n "$tool" ] && { have "$tool" && echo "$tool: $(command -v "$tool")" || echo "::warning::open-nitpick: $tool did not install"; }
        done

    - name: Review
      id: review
      shell: bash
      # Every user-controlled value arrives as an environment variable rather
      # than being interpolated into the script. Interpolating ${{ }} directly
      # into a run block lets an input containing shell metacharacters execute
      # arbitrary commands in this step.
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LLM_PROVIDER: ${{ inputs.provider }}
        LLM_MODEL: ${{ inputs.model }}
        LLM_API_KEY: ${{ inputs.api-key }}
        PR_NUMBER: ${{ inputs.pr-number }}
        NITPICK_CONFIG: ${{ inputs.config }}
        NITPICK_FAIL_ON: ${{ inputs.fail-on }}
        NITPICK_INSTRUCTION: ${{ inputs.instruction }}
        NITPICK_DRY_RUN: ${{ inputs.dry-run }}
        NITPICK_SKIP_DRAFTS: ${{ inputs.skip-drafts }}
        NITPICK_ARGS: ${{ inputs.args }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_BEFORE: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: |
        set -uo pipefail

        flags=(-repo "$GITHUB_WORKSPACE")

        if [ -n "$NITPICK_CONFIG" ] && [ -f "$GITHUB_WORKSPACE/$NITPICK_CONFIG" ]; then
          flags+=(-config "$NITPICK_CONFIG")
        fi
        if [ -n "$NITPICK_FAIL_ON" ]; then
          flags+=(-fail-on "$NITPICK_FAIL_ON")
        fi
        if [ -n "$NITPICK_INSTRUCTION" ]; then
          flags+=(-instruction "$NITPICK_INSTRUCTION")
        fi
        if [ "$NITPICK_DRY_RUN" = "true" ]; then
          flags+=(-dry-run)
        fi
        if [ "$NITPICK_SKIP_DRAFTS" = "true" ]; then
          flags+=(-skip-draft)
        fi

        # What to review depends on the event. A pull request event names its
        # pull request through the environment; a dispatch or a comment names
        # one through pr-number; a push has no pull request and is reviewed as
        # the pushed range, printed rather than posted.
        case "$EVENT_NAME" in
          pull_request|pull_request_target|merge_group)
            ;;
          push)
            base="$EVENT_BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD~1 2>/dev/null || true)"
            fi
            if [ -z "$base" ]; then
              echo "::error::open-nitpick: a push with no reachable parent commit cannot be reviewed"
              echo "result=error" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            flags+=(-base "$base" -head "$HEAD_SHA")
            echo "Reviewing the pushed range $base..$HEAD_SHA; nothing is posted on a push."
            ;;
          *)
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::open-nitpick: $EVENT_NAME names no pull request; set the pr-number input"
              echo "result=error" >> "$GITHUB_OUTPUT"
              exit 2
            fi
            ;;
        esac
        if [ -n "$PR_NUMBER" ]; then
          flags+=(-pr "$PR_NUMBER")
        fi
        if [ "$IS_FORK" = "true" ]; then
          echo "::notice::open-nitpick: pull request from a fork; if the token cannot post, the review goes to the job summary"
        fi

        # Extra args are split on whitespace deliberately; they are an escape
        # hatch for flags, not a place to pass a shell command.
        read -r -a extra <<< "$NITPICK_ARGS"

        # The CLI writes result, findings and the per-severity counts to
        # GITHUB_OUTPUT itself, and the review to GITHUB_STEP_SUMMARY.
        set +e
        nitpick review "${flags[@]}" ${extra+"${extra[@]}"}
        status=$?
        set -e

        # Exit 1 means the review ran and tripped the configured gate, which
        # should fail the job. Exit 2 means the review could not run at all —
        # a materially different outcome that must not read as "found issues".
        case "$status" in
          0|1) ;;
          *) echo "::error::open-nitpick failed to run (exit $status)"
             grep -q '^result=' "$GITHUB_OUTPUT" 2>/dev/null || echo "result=error" >> "$GITHUB_OUTPUT" ;;
        esac
        exit "$status"
