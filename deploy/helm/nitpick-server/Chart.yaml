---
apiVersion: v2
name: nitpick-server
description: >-
  The nitpick server: the notary, which keeps the model answers of code reviews
  so the same inputs replay them and an interrupted review resumes, insights, and
  the hub that shows what they hold. It keeps its state in Postgres or MySQL, so it
  runs as many replicas as you give it.
type: application
# Development values. The publish workflow packages the chart with the release
# tag's version for both fields, so a published chart names its own image. A
# checkout installs the latest published image, which is tagged latest.
version: 0.0.0
appVersion: "latest"
home: https://github.com/nitpick-oss/nitpick
sources:
  - https://github.com/nitpick-oss/nitpick
