---
# The server keeps everything in a SQL database, Postgres or MySQL, so any number of
# replicas may run against it. Sessions, sign-in state and the notary's and insights'
# records are all there; a pod holds nothing that another cannot answer for.
replicaCount: 1

image:
  repository: ghcr.io/nitpick-oss/nitpick-server
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Who may read and write records. Give hashes, never secrets: the server only
# ever compares hashes, and a Secret holding hashes is not a credential.
#   printf %s "$SECRET" | nitpick-server -hash
tokens: []
#  - name: ci
#    role: authoritative        # authoritative | provisional | read
#    hash: <64 hex characters>

# Or a Secret you manage yourself, with one key, `tokens`, holding
# whitespace-separated name:role:sha256:<hash> entries.
existingSecret: ""

# Who may post to and read the insights component, when the server
# configuration lists it. Hashes, as above.
insightsTokens: []
#  - name: ci
#    role: write                # write | read
#    hash: <64 hex characters>
# Or a Secret you manage yourself, with one key, `tokens`.
insightsExistingSecret: ""

# Accept GitHub Actions identity tokens instead of, or beside, static tokens.
oidc:
  audience: ""
  issuer: https://token.actions.githubusercontent.com
  # role:subject-pattern, first match wins.
  allow: []
  #  - "authoritative:repo:acme/app:ref:refs/heads/main"
  #  - "provisional:repo:acme/app:*"

# Let provisional tokens clear a record (nitpick review -fresh).
authorClear: false

# Sign-in for the hub UI. Left empty, there is no UI and only the machine tokens
# above work, as with the notary alone. The name of a Secret holding server.yaml
# (see docs/server.md), and, for the password provider, a users file.
config:
  existingSecret: ""
  # Keys of that Secret: the configuration, and any files it points at, such as
  # users, client-secret, idp-metadata.xml, sp.key and sp.crt. They are mounted
  # under /etc/nitpick/.
  file: server.yaml

# The database. By default the chart runs one of its own, from the official image of
# the engine, with a password it generates once and keeps in a Secret.
database:
  # postgres | mysql | none. With none, set externalDatabase.
  bundled: postgres
  name: nitpick
  username: nitpick
  # A Secret you manage, instead of the one the chart generates. Keys: `password`,
  # and for mysql `root-password`.
  existingSecret: ""
  # Total connections the engine accepts. Each server pod holds up to 20, so this
  # must stay above 20 times replicaCount.
  maxConnections: 200
  image:
    postgres: postgres:16
    mysql: mysql:8.4
  # Separate from image.pullPolicy: a cluster that loads the server image by hand and
  # sets that to Never still has to pull the database's.
  pullPolicy: IfNotPresent
  persistence:
    # Off, the data is lost when the database pod restarts.
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# A database you run, when database.bundled is none. The URL carries the password, so
# keep it in a Secret: either name one, with the URL under `existingSecretKey`, or
# give the URL here and the chart makes the Secret.
#   postgres://user:password@host:5432/nitpick?sslmode=require
#   mysql://user:password@host:3306/nitpick?tls=true
externalDatabase:
  url: ""
  existingSecret: ""
  existingSecretKey: url

service:
  type: ClusterIP
  port: 8484
  # Only for type NodePort.
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: notary.example.com
  #    paths: [/]
  tls: []

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 256Mi}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
