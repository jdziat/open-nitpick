# yamllint disable-file
# A Go template: not valid YAML until Helm renders it.
{{- if and (ne .Values.database.bundled "none") (not .Values.database.existingSecret) }}
{{- $name := printf "%s-db" (include "notary.fullname" .) }}
{{- /* A password is generated once. On an upgrade the one already in the cluster is read back, so it keeps matching the data directory the database made with it. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := randAlphaNum 32 }}
{{- $root := randAlphaNum 32 }}
{{- if and $old $old.data }}
{{- $pw = index $old.data "password" | b64dec }}
{{- if hasKey $old.data "root-password" }}{{ $root = index $old.data "root-password" | b64dec }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "notary.labels" . | nindent 4 }}
  annotations:
    # The data directory outlives the release and was made with this password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $pw | b64enc }}
  {{- if eq .Values.database.bundled "mysql" }}
  root-password: {{ $root | b64enc }}
  {{- end }}
{{- end }}
