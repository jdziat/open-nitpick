# yamllint disable-file
# A Go template: not valid YAML until Helm renders it.
{{- include "notary.validateDatabase" . }}
{{- if and .Values.oidc.audience (not .Values.oidc.allow) }}
{{- fail "oidc.audience needs oidc.allow: a token no rule matches is refused, so an empty list admits nobody" }}
{{- end }}
{{- if and .Values.existingSecret .Values.tokens }}
{{- fail "tokens and existingSecret are both set: the chart would use existingSecret and ignore tokens. Set one" }}
{{- end }}
{{- if and .Values.oidc.allow (not .Values.oidc.audience) }}
{{- fail "oidc.allow needs oidc.audience" }}
{{- end }}
{{- if and .Values.insightsTokens .Values.insightsExistingSecret }}
{{- fail "set insightsTokens or insightsExistingSecret, not both: the Secret you name wins and the listed tokens would be silently ignored" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notary.fullname" . }}
  labels: {{- include "notary.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "notary.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "notary.selector" . | nindent 8 }}
      annotations:
        {{- if and (not .Values.existingSecret) (or .Values.tokens (include "notary.generateToken" .)) }}
        checksum/tokens: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and (not .Values.insightsExistingSecret) .Values.insightsTokens }}
        checksum/insights-tokens: {{ include (print $.Template.BasePath "/insights-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
        checksum/database-url: {{ include (print $.Template.BasePath "/database-url-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- if ne .Values.database.bundled "none" }}
      initContainers:
        # The server refuses to start without its database, so wait for the bundled one
        # here and not in a restart loop.
        - name: wait-for-database
          image: {{ index .Values.database.image .Values.database.bundled | quote }}
          imagePullPolicy: {{ .Values.database.pullPolicy }}
          command:
            - sh
            - -c
            {{- if eq .Values.database.bundled "postgres" }}
            - until pg_isready -h {{ include "notary.dbHost" . }} -p 5432 -d {{ .Values.database.name }} -U {{ .Values.database.username }}; do sleep 2; done
            {{- else }}
            - until mysqladmin ping -h {{ include "notary.dbHost" . }} --silent; do sleep 2; done
            {{- end }}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      {{- end }}
      containers:
        - name: notary
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr=:8484
            {{- if .Values.authorClear }}
            - -author-clear
            {{- end }}
            {{- if .Values.oidc.audience }}
            - -oidc-audience={{ .Values.oidc.audience }}
            - -oidc-issuer={{ .Values.oidc.issuer }}
            {{- range .Values.oidc.allow }}
            - -oidc-allow={{ . }}
            {{- end }}
            {{- end }}
          env:
            {{- if ne .Values.database.bundled "none" }}
            # Defined before the URL, which expands it.
            - name: NITPICK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notary.dbSecretName" . }}
                  key: password
            - name: NITPICK_DATABASE_URL
              value: {{ printf "%s://%s:$(NITPICK_DB_PASSWORD)@%s:%s/%s" .Values.database.bundled .Values.database.username (include "notary.dbHost" .) (include "notary.dbPort" .) .Values.database.name | quote }}
            {{- else }}
            - name: NITPICK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "notary.dbURLSecretName" . }}
                  key: {{ .Values.externalDatabase.existingSecretKey | default "url" }}
            {{- end }}
            {{- if or .Values.tokens .Values.existingSecret (include "notary.generateToken" .) }}
            - name: NITPICK_NOTARY_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "notary.secretName" . }}
                  key: tokens
            {{- end }}
            {{- if or .Values.insightsTokens .Values.insightsExistingSecret }}
            - name: NITPICK_INSIGHTS_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "notary.insightsSecretName" . }}
                  key: tokens
            {{- end }}
            {{- if .Values.config.existingSecret }}
            - name: NITPICK_SERVER_CONFIG
              value: /etc/nitpick/{{ .Values.config.file }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8484}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if .Values.config.existingSecret }}
          volumeMounts:
            - {name: config, mountPath: /etc/nitpick, readOnly: true}
          {{- end }}
      {{- if .Values.config.existingSecret }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.config.existingSecret }}
            # Readable by the pod's group only: it holds a client secret and keys.
            defaultMode: 0440
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
