# yamllint disable-file
# A Go template: not valid YAML until Helm renders it.
{{- if and (not .Values.insightsExistingSecret) .Values.insightsTokens }}
{{- $roles := list "write" "read" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notary.fullname" . }}-insights
  labels: {{- include "notary.labels" . | nindent 4 }}
type: Opaque
stringData:
  tokens: |-
{{- range .Values.insightsTokens }}
{{- if not (has .role $roles) }}{{ fail (printf "insightsTokens[%s]: role must be one of write, read, got %q" .name .role) }}{{ end }}
{{- if not (regexMatch "^[0-9a-f]{64}$" (.hash | toString)) }}{{ fail (printf "insightsTokens[%s]: hash must be the 64 hex characters of a SHA-256. Hash the secret with nitpick-server -hash; a secret must never be put here" .name) }}{{ end }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" .name) }}{{ fail (printf "insightsTokens: name %q may hold only letters, digits, dot, underscore and dash" .name) }}{{ end }}
    {{ .name }}:{{ .role }}:sha256:{{ .hash }}
{{- end }}
{{- end }}
