# yamllint disable-file
# A Go template: not valid YAML until Helm renders it.
{{- if and (not .Values.existingSecret) .Values.tokens }}
{{- $roles := list "authoritative" "provisional" "read" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notary.fullname" . }}
  labels: {{- include "notary.labels" . | nindent 4 }}
type: Opaque
stringData:
  tokens: |-
{{- range .Values.tokens }}
{{- if not (has .role $roles) }}{{ fail (printf "tokens[%s]: role must be one of authoritative, provisional, read, got %q" .name .role) }}{{ end }}
{{- if not (regexMatch "^[0-9a-f]{64}$" (.hash | toString)) }}{{ fail (printf "tokens[%s]: hash must be the 64 hex characters of a SHA-256. Hash the secret with nitpick-server -hash; a secret must never be put here" .name) }}{{ end }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" .name) }}{{ fail (printf "tokens: name %q may hold only letters, digits, dot, underscore and dash" .name) }}{{ end }}
    {{ .name }}:{{ .role }}:sha256:{{ .hash }}
{{- end }}
{{- end }}
{{- if and (not .Values.existingSecret) (not .Values.tokens) (include "notary.generateToken" .) }}
{{- /* Nothing was configured, so the server would refuse every request. A token is made once and read back on upgrade. Its secret is in this Secret under `token`; the server is given only its hash. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (include "notary.fullname" .) }}
{{- $token := randAlphaNum 40 }}
{{- if and $old $old.data (hasKey $old.data "token") }}{{ $token = index $old.data "token" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notary.fullname" . }}
  labels: {{- include "notary.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
  tokens: {{ printf "generated:authoritative:sha256:%s" (sha256sum $token) | quote }}
{{- end }}
