# yamllint disable-file
# A Go template: not valid YAML until Helm renders it.
{{- if and .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notary.dbURLSecretName" . }}
  labels: {{- include "notary.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.externalDatabase.url | quote }}
{{- end }}
