# Model prices for the eval battery, in USD per MILLION tokens.
#
# This is DATA, and it lives in a file for one reason: prices change without
# notice and nobody redeploys a benchmark when they do. Compiled into Go, a
# stale table would keep answering questions about cost-to-performance with
# numbers nobody had looked at in months, and the answer would still arrive with
# a dollar sign in front of it. Here every rate carries a date instead.
#
# PROVENANCE IS PER MODEL, and every field below is required:
#
#   captured_on  the local calendar date the rate was read from the vendor
#   source       where it was read from
#   endpoint     WHICH of the vendor's endpoints this rate belongs to
#   routing      what the other endpoints for this model charge
#
# There is deliberately no table-wide capture date. There used to be, and it was
# the wrong shape: rates get refreshed one model at a time, and a single header
# date is bumped by whoever touched one entry — which re-dates the other
# nineteen as fresh without anyone having looked at them. The reported table age
# is DERIVED as the oldest entry in it, which no single edit can improve.
#
# Those fields are a CLAIM. testdata/pricing-source.json is the evidence: the
# vendor's own pricing object for every model below AND for every endpoint that
# serves it, captured verbatim, from which this file is re-derived and checked on
# every `go test` by TestShippedPricesMatchTheCapturedVendorResponse. Edit one
# without the other and the suite says so.
#
# ENDPOINT AND ROUTING. This is the error the second round found, and it is not a
# transcription slip — every number in the previous file was a correct copy of
# `/api/v1/models`. The mistake was believing that object names A PRICE. It names
# ONE ENDPOINT'S price, and OpenRouter serves 15 of these 20 models from between
# 5 and 34 endpoints at different rates:
#
#   openai/gpt-5.6-luna     6 endpoints    $0.05 to $1.10 in     22.0x
#   openai/gpt-5.6-terra    6 endpoints    $0.50 to $2.75 in      5.5x
#   openai/gpt-5.4          6 endpoints    $1.25 to $5.00 in      4.0x
#   deepseek/deepseek-v4-pro 18 endpoints  $0.435 to $1.74 in     4.0x
#   z-ai/glm-5.2           34 endpoints    $0.5866 to $2.31 in    3.9x
#   google/gemini-3.5-flash 6 endpoints    $0.75 to $2.70 in      3.6x
#   qwen/*                  1 endpoint     no spread              1.0x
#
# open-nitpick pins no provider, so which endpoint serves a request is the
# router's choice and is recorded nowhere. A single number in a $/DEFECT column
# is therefore a POINT INSIDE A BAND whose width is a property of the model, and
# the five models with no band at all are the five qwen entries. Ranking a qwen
# row against a glm-5.2 row on six decimal places compares an exact figure with
# one that could be 3.9x either way, and the column gave a reader nothing to see
# that with.
#
# The direction, measured against the cheapest endpoint: the recorded rate is
# exact on 8 models and ABOVE the floor on 12. It is never below. The eight are
# the five single-endpoint qwen entries, deepseek-v4-pro and the two anthropic
# ones, whose alternates are all dearer; the twelve are 2.00x on the six openai
# and two google entries, whose floor is a half-price `/flex` service tier, then
# glm-5.2 at 1.296x, minimax-m2.7 at 1.042x, kimi-k2.7-code at 1.028x and glm-5.1
# at 1.015x.
#
# That is not an error — the recorded rate is a real endpoint's real rate, and
# `routing` is what says the rest — but it is the reason the band is published:
# the size of the gap tracks MODEL CLASS, which is exactly the axis the table is
# read along.
#
# `cheapest` AND `dearest` NAME AN ENDPOINT AND ARE DERIVED FROM RATES, NOT FROM
# ARRAY ORDER. This is the round-3 error, and it lived in this header as an
# assertion: "`endpoints` is returned cheapest-first". It is not. The array is
# unsorted by price for 8 of the 20 models, in every case because the half-price
# `/flex` tier is listed after the standard one — so 8 entries named a `cheapest`
# that costs exactly 2.00x the min_input recorded three lines below it, and never
# one below. The numbers were right; the advice attached to them ("pin the
# cheapest and the band collapses") pointed at twice the floor, on the eight
# first-party endpoints. Same one-directional shape as the round-2 error, and the
# same axis: it tracks model class.
#
# Derive both from the rates, and expect ties — six of claude-opus-5's seven
# endpoints share its floor, and both gemini entries have two at each end. Any
# endpoint AT the extreme is a correct answer; one merely near it is not:
#
#   jq -r '.data.endpoints | sort_by(.pricing.prompt|tonumber) |
#          (first|"cheapest \(.tag) \(.pricing.prompt)"),
#          (last |"dearest  \(.tag) \(.pricing.prompt)")'
#
# parseRouting checks the half of this that is checkable without the endpoint
# list: if an entry names its OWN endpoint as the cheapest, its own recorded rate
# has to be the band floor. That catches all eight.
#
# The fix is not a different number. `routing` records what the whole endpoint
# set charges, the cost column reports a RANGE where one exists, and an operator
# who wants a point estimate has an action: pin the provider, and the range
# collapses to a rate this file can name.
#
# A model with NO entry reports its cost as unknown, never as zero — zero is a
# number a reader will act on. An entry present with a rate of 0.0 is different:
# that is a published price of zero (a free tier), and it says so by existing.
#
# TIERS. OpenRouter publishes `pricing.overrides` keyed on `min_prompt_tokens`
# for 11 of the 20 models below, and this file records them under `tiers`. A
# tier INHERITS every rate it does not restate, matching the vendor's own
# encoding — google/gemini-3.1-pro-preview's 200,000-token tier raises input,
# output and cache_read and leaves cache_write at the base rate, so restating it
# here would be inventing a number the vendor did not publish.
#
# The tier a call is billed at is chosen PER CALL from that call's reported
# prompt size, never from an aggregate. An earlier version of this file recorded
# base rates only, with a comment asserting that reviews are billed at the qwen
# second tier and are therefore understated by up to 3.3x. Both halves were
# guesses. The rates were right, and the tier claim was never measured — the
# whole fixture corpus runs at 1,500 to 2,200 prompt tokens per call against a
# 32,000-token first step, so "correcting" the qwen rates upward would have
# overstated the three cheapest models in the battery by 1.8x to 3.3x.
# `review.token_budget_per_request` is 60,000, which is a CAP on assembled
# context and not the size of any prompt actually sent.
#
# Regenerate a model's entry, INCLUDING its tiers and its routing block, then
# set its captured_on. Both calls are needed; the second is the one that was
# missing for two rounds:
#
#   curl -s https://openrouter.ai/api/v1/models |
#     jq '.data[] | select(.id == "MODEL/ID") | .pricing'
#   curl -s https://openrouter.ai/api/v1/models/MODEL/ID/endpoints |
#     jq '.data.endpoints[] | {tag, provider_name, pricing}'
#
# input / output are the standard prompt and completion rates.
#
# cache_read and cache_write are omitted for providers that publish no separate
# cache tier; an omitted rate falls back to `input`, which is what such a
# provider actually charges. Writing 0.0 there instead would claim free caching.
# The routing minima and maxima apply that same fallback PER ENDPOINT before
# taking the extremum, so they are the bounds of what could actually be billed
# rather than the bounds of what happens to be published.
#
# PRICED AS A REFUSAL, not as a rate:
#
#   cache_write_1h      the two anthropic entries publish a 1-hour cache TTL at
#                       1.6x the 5-minute rate ($6.00 against $3.75 on
#                       sonnet-4.6, $10.00 against $6.25 on opus-5). The SDK
#                       reports cache-creation tokens WITHOUT a TTL, so on these
#                       two models a call that wrote any is one of two amounts
#                       1.6x apart and nothing can say which: the row reports
#                       unknown. It used to be recorded as a comment saying
#                       nothing enables prompt caching — true of this month's
#                       call sites, not of the accounting — and the five-minute
#                       rate was billed silently, which is the cheaper of the two
#                       and so an error in the flattering direction. This line
#                       also said 2x for a round, a number nobody had divided.
#
# NOT PRICED HERE, checked and deliberately absent:
#
#   internal_reasoning  published by the two gemini entries only, and equal to
#                       their `completion` rate in both. Reasoning tokens are a
#                       SUBSET of completion in the SDK's usage, so they are
#                       already billed at exactly the right rate; a separate
#                       term would double-count them.
#   discount            several endpoints publish one. It is kept in the receipt
#                       and not applied: nothing states what it is conditional
#                       on, and a discount applied on a guess moves every number
#                       in the flattering direction.
#   image / audio / web_search  no path in a code review sends any of these.
#
# NITPICK_EVAL_PRICES=/path/to/prices.yaml overrides this file wholesale, for an
# operator who has fresher data and does not want to edit the repository.
#
# Entries are ordered by input rate. The spread across this table is the entire
# reason the column exists: qwen3.7-flash at $0.03 against gpt-5.6-sol at $5.00
# is 167x on input, so a model that grades marginally better can still be an
# indefensible default.

