# The Synthetic pairing: the best per-dollar reviewer, the documented triager.
#
# docs/providers.md names GLM-5.3-Flash as the triage model this repository's
# own configuration uses, and pairs it with Kimi-K3 as the reviewer. This file
# swaps the reviewer for qwen3.8-27b, which docs/comparison.md measures at the
# lowest noise of any model under $0.03 and the same weighted recall as
# sonnet. The pair has not been measured; the two halves have.
#
# Both models are served on Synthetic, so a flat subscription prices this at
# nothing per review and the cost column that marked qwen down does not apply.
models:
  default:
    provider: synthetic
    model: hf:Qwen/Qwen3.8-27B
  triage:
    provider: synthetic
    model: hf:zai-org/GLM-5.3-Flash
    temperature: 0
