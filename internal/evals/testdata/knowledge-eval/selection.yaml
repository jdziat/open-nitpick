# The frozen selection for the knowledge evaluation, issue #84.
#
# Selection rule, applied before any retrieval tuning and recorded so the set
# can be rebuilt: merged pull requests carrying each repository's own bug
# label (prometheus kind/bug, httpx and typescript-eslint bug) or, where the
# repository labels issues rather than pull requests, a conventional `fix(`
# title (cargo), merged before 2026-09-01, in the order the GitHub search API
# returned them, keeping the first ten per repository that change source and
# whose defect can be written from the fix and its own discussion. Excluded on
# that rule: documentation and lint-warning fixes, test-only changes, feature
# removals, a reverted refactor and its revert, and one output-polish change
# with no stated defect.
#
# Clean changes are merged refactors touching source with no bug label and no
# subsequent revert. That is a proxy and not a proof: nobody can show a change
# introduced no defect, and a finding on one of these is unsupported only in
# the sense that the repository's own history never recorded it.
#
# Adjudicated by one reader, not two. #84 asks for independently adjudicated
# fixes; independent here means chosen without reference to the knowledge
# corpus, which the rule above enforces, and NOT that a second person checked
# them. That limit belongs in the results.

