# golangci-lint configuration owned by open-nitpick.
#
# It is embedded in the binary and written to a temporary directory outside the
# repository under review, because the alternative is not "no configuration" but
# "golangci-lint's defaults", and those defaults are reachable from the tree.
# --no-config left them in place, and one line at the top of a changed file was
# enough to switch the analyzer off for that file:
#
#	// Code generated by protoc-gen-go. DO NOT EDIT.
#
# linters.exclusions.generated defaults to "lax", which skips a file whose first
# line matches the Go generated-code convention. There is no command-line flag
# for it in golangci-lint 2.8.0 -- `disable` can only be said in a config file --
# so choosing --no-config removed the attacker's configuration and our own with
# it. This file is the half we are taking back.
#
# It deliberately does NOT restate the settings that are already command-line
# flags. Those are passed on every invocation so that they bind an operator's
# linters.golangci_config as well; see golangciLint.Run.
version: "2"

linters:
  # Pinned rather than inherited. It is already golangci-lint 2.8.0's default,
  # and stating it means a future release changing that default cannot quietly
  # change what open-nitpick reports.
  default: standard

  exclusions:
    # THE POINT OF THIS FILE. Under the default, "lax", the first line of a file
    # decides whether that file is analyzed -- and the file under review is
    # written by the change under review.
    generated: disable
